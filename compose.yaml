# Run on the home server: docker compose up -d --build
# Settings come from .env (same file as a local install). See home-server.md.
services:
  fitbit:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: fitbit-air-companion:latest
    container_name: fitbit
    restart: unless-stopped
    env_file: .env
    environment:
      # Override .env values that only make sense outside a container.
      HOST: 0.0.0.0
      PORT: "8000"
      DATA_DIR: /app/data
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/app/data
    ports:
      # Loopback: for the SSH tunnel (needed for Google reconnects, which must use 127.0.0.1).
      - "127.0.0.1:${FITBIT_PORT:-8000}:8000"
      # Home network: uncomment with the server's LAN IP, and set APP_PASSWORD in .env first.
      # Never use a bare "8000:8000": Docker bypasses ufw, and 0.0.0.0 also covers every
      # other interface (VPNs, Docker networks).
      # - "192.168.1.50:${FITBIT_PORT:-8000}:8000"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
