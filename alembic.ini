# Used only for developer commands such as:
#   .venv/bin/alembic revision --autogenerate -m "..."
# The app itself runs migrations programmatically (see fitbit_app/storage/migrate.py).
# The database URL comes from the app settings (DATA_DIR), not from this file.

[alembic]
script_location = src/fitbit_app/storage/migrations
prepend_sys_path = src
